<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revisão em Rede</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: uma coluna estreita; a trilha de fases é desenhada como uma rede desdobrada no tempo (nós ligados por setas) */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#15203A; --muted:#58647F; --line:#CBD3E1;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FBE6D8;
  --net:#1D5FA8; --net-soft:#DCE8F7;
  --ok:#0E7A5C; --ok-soft:#D5F1E6; --bad:#B42318; --bad-soft:#FADFDC;
  --f-display:"Space Grotesk",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#161F34; --ink:#E5EAF4; --muted:#93A0BB; --line:#2A3755;
  --accent:#FB8B4D; --accent-ink:#1A0E05; --accent-soft:#3A2416;
  --net:#6FA8EC; --net-soft:#16294A;
  --ok:#3DD3A3; --ok-soft:#10352A; --bad:#F77C7C; --bad-soft:#3C1B1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#161F34; --ink:#E5EAF4; --muted:#93A0BB; --line:#2A3755;
  --accent:#FB8B4D; --accent-ink:#1A0E05; --accent-soft:#3A2416;
  --net:#6FA8EC; --net-soft:#16294A;
  --ok:#3DD3A3; --ok-soft:#10352A; --bad:#F77C7C; --bad-soft:#3C1B1E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,2.8rem);letter-spacing:-.02em}
h2{font-size:1.35rem}
p{margin:0}
.mono,code{font-family:var(--f-mono);font-size:.92em}
code{background:var(--net-soft);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* hero */
.hero{display:flex;flex-direction:column;gap:10px}
.signal{width:100%;height:70px;display:block}
.signal path{fill:none;stroke:var(--accent);stroke-width:2}
.signal .base{stroke:var(--line);stroke-width:1}

/* trilhas */
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px}
.tab{flex:1;min-width:0;border:0;background:transparent;border-radius:8px;padding:10px 8px;font-weight:600;font-size:.95rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.track-intro{display:flex;flex-direction:column;gap:6px}

.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.node{position:relative;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0}
.node:not(:last-child)::after{content:"";position:absolute;left:25px;top:52px;bottom:-10px;width:2px;background:var(--line)}
.node .dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1}
.node.done .dot{border-color:var(--ok);color:var(--ok)}
.node .info{min-width:0}
.node .info b{display:block;font-family:var(--f-display);font-weight:700;font-size:1.02rem}
.node .info span{font-size:.88rem;color:var(--muted)}
.node .best{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:right}
.node button.play{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:.9rem}
.node button.play:hover{border-color:var(--accent);color:var(--accent)}
.node-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.cta-row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

details.cola{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.cola summary{cursor:pointer;font-weight:600}
details.cola ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}

/* jogo */
.hud{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-family:var(--f-mono);font-size:.85rem}
.hud .left{display:flex;gap:14px;flex-wrap:wrap}
.hud b{font-variant-numeric:tabular-nums}
.combo{color:var(--accent);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qtext{font-size:1.08rem;font-weight:500}
.qtext .f,.exp .f{display:block;font-family:var(--f-mono);background:var(--net-soft);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.opt .k{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.gone{opacity:.3}
.opt:disabled{cursor:default}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vf .opt{grid-template-columns:1fr;text-align:center;font-weight:600}
.fields{display:flex;flex-direction:column;gap:10px}
.field{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,170px);gap:10px;align-items:center}
.field label{font-family:var(--f-mono);font-size:.92rem}
.field input{font:inherit;font-family:var(--f-mono);padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field input.right{border-color:var(--ok);background:var(--ok-soft)}
.field input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord-pool,.ord-pick{display:flex;flex-direction:column;gap:8px}
.ord-pick{min-height:20px}
.ord-pick .opt{grid-template-columns:28px 1fr}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 2px;font-size:.9rem}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb h3{font-size:1.05rem}
.fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--bad)}
.exp{font-size:.95rem}
.tag{font-family:var(--f-mono);font-size:.78rem;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.net{background:var(--net-soft);color:var(--net)}

/* aula */
.lesson{display:flex;flex-direction:column;gap:12px;font-size:1rem;max-width:68ch}
.lesson h3{font-size:1.08rem;margin-top:8px}
.lesson ul,.lesson ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.lesson .f{display:block;font-family:var(--f-mono);background:var(--net-soft);border-radius:8px;padding:10px 12px;margin-top:6px;font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.lesson .key{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0}
.node .links{display:flex;gap:6px;align-items:center}
.node button.read{border:0;background:none;color:var(--muted);text-decoration:underline;padding:8px 4px;font-size:.88rem}
/* fim */
.big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:12px}
.review article{border-left:3px solid var(--bad);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.review article .q{font-weight:600}
@media (max-width:480px){.field{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.big{font-size:2.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.97)}100%{transform:scale(1)}}
.fb{animation:pop .18s ease-out;transform-origin:top left}
</style>
</head>
<body>

<main class="wrap" id="app"></main>

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const rnd = (min,max,step=0.01) => +(Math.round((min+Math.random()*(max-min))/step)*step).toFixed(2);
const nz = (min,max) => { let v; do { v = rnd(min,max); } while (Math.abs(v) < 0.05); return v; };
const fmt = v => { const s = (+(+v).toFixed(4)).toString().replace(".", ","); return s.startsWith("-") ? "−"+s.slice(1) : s; };
const par = v => v < 0 ? "("+fmt(v)+")" : fmt(v);
const parseNum = s => { s = String(s).trim().replace(/\s/g,"").replace(/[−–]/g,"-").replace(",", "."); return s === "" ? NaN : Number(s); };
const near = (u,a) => Math.abs(u-a) <= Math.max(0.0015, Math.abs(a)*0.01);
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("revisao-em-rede")||"{}"); } catch(e){ return {}; } },
  set(o){ try { localStorage.setItem("revisao-em-rede", JSON.stringify(o)); } catch(e){} }
};

/* ---------- geradores: BPTT ---------- */
const G = {};
G.deltaFinal = () => {
  const phi = rnd(0.12,0.25), e = nz(-0.9,0.9), d = phi*e;
  return { t:"num",
    q:`Último instante do intervalo de treino, <b>n = n₁ = 3</b>. O neurônio j tem φ'(vⱼ(3)) = <b>${fmt(phi)}</b> e erro eⱼ(3) = <b>${fmt(e)}</b>. Calcule o gradiente local.`,
    fields:[{label:"δⱼ(3) =", ans:d}],
    hint:"Em n₁ não existe instante futuro, então só entra o erro atual: δⱼ(n₁) = φ'(vⱼ(n₁))·eⱼ(n₁).",
    exp:`Em n = n₁ não há erro vindo do futuro.<span class="f">δⱼ(3) = φ'·e = ${fmt(phi)} · ${par(e)} = ${fmt(d)}</span>` };
};
G.deltaLogistic = () => {
  const tanh = Math.random() < 0.5;
  if (!tanh){
    const y = rnd(0.2,0.9,0.05), dd = pick([0,1]), e = dd - y, phi = y*(1-y), d = phi*e;
    return { t:"num",
      q:`Neurônio de saída com função <b>logística</b>, em n = n₁. A saída foi yⱼ = <b>${fmt(y)}</b> e a resposta desejada era dⱼ = <b>${dd}</b>. Calcule φ'(vⱼ) e δⱼ(n₁). (Use e = d − y.)`,
      fields:[{label:"φ'(vⱼ) =", ans:phi},{label:"δⱼ(n₁) =", ans:d}],
      hint:"Na logística, φ'(v) = y·(1 − y). Depois, δ = φ'·e com e = d − y.",
      exp:`<span class="f">e = d − y = ${dd} − ${fmt(y)} = ${fmt(e)}
φ' = y(1 − y) = ${fmt(y)} · ${fmt(1-y)} = ${fmt(phi)}
δ = φ'·e = ${fmt(phi)} · ${par(e)} = ${fmt(d)}</span>` };
  }
  const y = nz(-0.8,0.8), dd = nz(-0.9,0.9), e = dd - y, phi = 1 - y*y, d = phi*e;
  return { t:"num",
    q:`Neurônio de saída com <b>tangente hiperbólica</b>, em n = n₁. A saída foi yⱼ = <b>${fmt(y)}</b> e a desejada dⱼ = <b>${fmt(dd)}</b>. Calcule φ'(vⱼ) e δⱼ(n₁). (Use e = d − y.)`,
    fields:[{label:"φ'(vⱼ) =", ans:phi},{label:"δⱼ(n₁) =", ans:d}],
    hint:"Na tanh, φ'(v) = 1 − y². Depois, δ = φ'·e com e = d − y.",
    exp:`<span class="f">e = d − y = ${fmt(dd)} − ${par(y)} = ${fmt(e)}
φ' = 1 − y² = 1 − ${par(y)}² = ${fmt(phi)}
δ = φ'·e = ${fmt(phi)} · ${par(e)} = ${fmt(d)}</span>` };
};
G.deltaMid = () => {
  const phi = rnd(0.1,0.25), e = nz(-0.6,0.6), w = nz(-1.5,1.5), dn = nz(-0.3,0.3), d = phi*(e + w*dn);
  return { t:"num",
    q:`Instante intermediário, n₀ &lt; n = 4 &lt; n₁. Neurônio j com φ'(vⱼ(4)) = <b>${fmt(phi)}</b> e erro eⱼ(4) = <b>${fmt(e)}</b>. Ele se liga a um único neurônio k pelo peso wⱼₖ = <b>${fmt(w)}</b>, que já tem δₖ(5) = <b>${fmt(dn)}</b>. Calcule δⱼ(4).`,
    fields:[{label:"δⱼ(4) =", ans:d}],
    hint:"Erro atual + erro do futuro: δⱼ(n) = φ'(vⱼ(n))·[eⱼ(n) + wⱼₖ·δₖ(n+1)].",
    exp:`Antes de n₁, o gradiente local soma o erro atual com o erro que volta do instante seguinte.<span class="f">δⱼ(4) = φ' · [e + w·δₖ(5)]
      = ${fmt(phi)} · [${fmt(e)} + ${par(w)}·${par(dn)}]
      = ${fmt(phi)} · [${fmt(e)} + ${par(w*dn)}]
      = ${fmt(phi)} · ${par(e+w*dn)} = ${fmt(d)}</span>` };
};
G.deltaSum = () => {
  const phi = rnd(0.1,0.25), e = nz(-0.5,0.5), w1 = nz(-1.2,1.2), d1 = nz(-0.3,0.3), w2 = nz(-1.2,1.2), d2 = nz(-0.3,0.3);
  const s = w1*d1 + w2*d2, d = phi*(e + s);
  return { t:"num",
    q:`Agora com <b>dois</b> neurônios no instante seguinte. Em n = 2 (n₀ = 0, n₁ = 3): φ'(vⱼ(2)) = <b>${fmt(phi)}</b>, eⱼ(2) = <b>${fmt(e)}</b>. Ligações: wⱼ₁ = <b>${fmt(w1)}</b> com δ₁(3) = <b>${fmt(d1)}</b>; wⱼ₂ = <b>${fmt(w2)}</b> com δ₂(3) = <b>${fmt(d2)}</b>. Calcule o somatório e δⱼ(2).`,
    fields:[{label:"Σₖ wⱼₖ δₖ(3) =", ans:s},{label:"δⱼ(2) =", ans:d}],
    hint:"Some w·δ de cada neurônio k do instante n+1, junte com o erro atual e multiplique por φ'.",
    exp:`<span class="f">Σ = ${par(w1)}·${par(d1)} + ${par(w2)}·${par(d2)} = ${fmt(w1*d1)} + ${par(w2*d2)} = ${fmt(s)}
δⱼ(2) = ${fmt(phi)} · [${fmt(e)} + ${par(s)}] = ${fmt(phi)} · ${par(e+s)} = ${fmt(d)}</span>` };
};
G.chain = () => {
  const p2 = rnd(0.12,0.25), e2 = nz(-0.8,0.8), p1 = rnd(0.12,0.25), e1 = nz(-0.5,0.5), w = nz(-1.5,1.5);
  const d2 = p2*e2, d1 = p1*(e1 + w*d2);
  return { t:"num",
    q:`Mini BPTT com um neurônio auto-realimentado (peso recorrente w = <b>${fmt(w)}</b>), intervalo n₀ = 0 até n₁ = 2.<span class="f">n = 2:  φ' = ${fmt(p2)}   e = ${fmt(e2)}
n = 1:  φ' = ${fmt(p1)}   e = ${fmt(e1)}</span>Faça o passo para trás: primeiro δ(2), depois δ(1).`,
    fields:[{label:"δ(2) =", ans:d2},{label:"δ(1) =", ans:d1}],
    hint:"O passo para trás vai de n₁ até n₀. δ(2) = φ'(2)·e(2). Depois δ(1) = φ'(1)·[e(1) + w·δ(2)].",
    exp:`O passo para trás começa no fim do intervalo.<span class="f">δ(2) = ${fmt(p2)} · ${par(e2)} = ${fmt(d2)}
δ(1) = ${fmt(p1)} · [${fmt(e1)} + ${par(w)}·${par(d2)}]
     = ${fmt(p1)} · ${par(e1+w*d2)} = ${fmt(d1)}</span>` };
};
G.dw = () => {
  const eta = pick([0.1,0.2,0.5]), d = [nz(-0.3,0.3),nz(-0.3,0.3),nz(-0.3,0.3)], x = [nz(-1,1),nz(-1,1),nz(-1,1)];
  const s = d[0]*x[0]+d[1]*x[1]+d[2]*x[2], dw = eta*s;
  return { t:"num",
    q:`Ajuste do peso wⱼᵢ no BPTT por época, com n₀ = 0, n₁ = 3 e η = <b>${fmt(eta)}</b>.<span class="f">δⱼ(1) = ${fmt(d[0])}   δⱼ(2) = ${fmt(d[1])}   δⱼ(3) = ${fmt(d[2])}
xᵢ(0) = ${fmt(x[0])}   xᵢ(1) = ${fmt(x[1])}   xᵢ(2) = ${fmt(x[2])}</span>Calcule Δwⱼᵢ.`,
    fields:[{label:"Δwⱼᵢ =", ans:dw}],
    hint:"Δwⱼᵢ = η · Σ δⱼ(n)·xᵢ(n−1), somando de n = n₀+1 até n₁. Repare no n−1 da entrada.",
    exp:`Cada δ do instante n multiplica a entrada do instante anterior (n−1).<span class="f">Σ = δ(1)x(0) + δ(2)x(1) + δ(3)x(2)
  = ${par(d[0])}·${par(x[0])} + ${par(d[1])}·${par(x[1])} + ${par(d[2])}·${par(x[2])}
  = ${fmt(d[0]*x[0])} + ${par(d[1]*x[1])} + ${par(d[2]*x[2])} = ${fmt(s)}
Δw = η·Σ = ${fmt(eta)} · ${par(s)} = ${fmt(dw)}</span>` };
};
G.stateSpace = () => {
  const a = rnd(0.3,0.9,0.1), b = rnd(0.5,1.5,0.1), c = rnd(0.5,2,0.5), x0 = nz(-1,1), u0 = nz(-1,1), u1 = nz(-1,1);
  const x1 = a*x0 + b*u0, x2 = a*x1 + b*u1, y2 = c*x2;
  return { t:"num",
    q:`Modelo de espaço de estados linear (escalar):<span class="f">x(n+1) = ${fmt(a)}·x(n) + ${fmt(b)}·u(n)
y(n)   = ${fmt(c)}·x(n)</span>Com x(0) = <b>${fmt(x0)}</b>, u(0) = <b>${fmt(u0)}</b> e u(1) = <b>${fmt(u1)}</b>, calcule x(1), x(2) e y(2).`,
    fields:[{label:"x(1) =", ans:x1},{label:"x(2) =", ans:x2},{label:"y(2) =", ans:y2}],
    hint:"Aplique x(n+1) = A·x(n) + B·u(n) duas vezes e depois y = C·x.",
    exp:`<span class="f">x(1) = ${fmt(a)}·${par(x0)} + ${fmt(b)}·${par(u0)} = ${fmt(x1)}
x(2) = ${fmt(a)}·${par(x1)} + ${fmt(b)}·${par(u1)} = ${fmt(x2)}
y(2) = ${fmt(c)}·${par(x2)} = ${fmt(y2)}</span>` };
};

/* ---------- geradores: sub-rede (Redes 2) ---------- */
const ipStr = a => a.join(".");
const maskOf = p => { const m=[]; for(let i=0;i<4;i++){ const bits=Math.max(0,Math.min(8,p-8*i)); m.push(bits?256-Math.pow(2,8-bits):0);} return m; };
G.hosts = () => {
  const p = pick([8,16,24,30]), m = maskOf(p), n = Math.pow(2,32-p)-2;
  const where = {8:"um enlace serial do Cenário 7 (10.0.0.0)", 16:"uma LAN do Cenário 5B (172.19.0.0)", 24:"uma LAN do Cenário 5B (192.168.5.0)", 30:"um enlace serial do Cenário 5B (10.0.0.0)"}[p];
  return { t:"num",
    q:`Quantos endereços de host <b>utilizáveis</b> existem na máscara <code>${ipStr(m)}</code> (/${p})? Ela aparece, por exemplo, em ${where}.`,
    fields:[{label:"hosts =", ans:n, exact:true}],
    hint:"Hosts utilizáveis = 2^(bits de host) − 2. Bits de host = 32 − prefixo.",
    exp:`<span class="f">/${p} → ${32-p} bits de host
2^${32-p} − 2 = ${n.toLocaleString("pt-BR")}</span>Tira-se 2 porque o endereço de rede e o de broadcast não vão para hosts.${p===30?" Por isso /30 é o padrão para enlaces ponto a ponto: sobram exatamente 2 IPs, um para cada roteador.":""}` };
};
G.netAddr = () => {
  const cases = [
    {ip:[172,19,200,pick([201,215,230,249])], p:16, note:"um PC da LAN direita do Cenário 5B"},
    {ip:[192,168,5,pick([100,104,109])], p:24, note:"o PC1 do Cenário 5B"},
    {ip:[10,0,0,pick([1,2])], p:30, note:"uma ponta do enlace R1–R2 do Cenário 5B"},
    {ip:[172,21,0,pick([1,7])], p:16, note:"o enlace Router1–switch L3 do Cenário 6"},
    {ip:[172,18,50,pick([50,254])], p:16, note:"a LAN do Laptop2 no Cenário 7"},
    {ip:[30,0,0,pick([1,2])], p:30, note:"o enlace switch L3–Router_2 do Cenário 6B"}
  ];
  const c = pick(cases), m = maskOf(c.p);
  const net = c.ip.map((o,i)=>o & m[i]), bc = c.ip.map((o,i)=>(o & m[i]) | (255 - m[i]));
  return { t:"txt",
    q:`O IP <code>${ipStr(c.ip)}</code> com máscara <code>${ipStr(m)}</code> é ${c.note}. Qual é o <b>endereço de rede</b> e o de <b>broadcast</b>?`,
    fields:[{label:"rede =", ans:ipStr(net)},{label:"broadcast =", ans:ipStr(bc)}],
    hint:"Rede: zere os bits de host (onde a máscara tem 0). Broadcast: ponha 1 em todos eles.",
    exp:`<span class="f">IP       ${ipStr(c.ip)}
máscara  ${ipStr(m)}  (/${c.p})
rede     ${ipStr(net)}
bcast    ${ipStr(bc)}</span>` };
};
G.dhcp = () => {
  const c = pick([
    {pool:"LAN_ESQUERDA (DHCP-ESQ)", start:[192,168,5,100], max:10},
    {pool:"LAN_DIREITA (DHCP-DIR)", start:[172,19,200,200], max:50},
    {pool:"LAN_DIREITA com outro tamanho", start:[172,19,200,200], max:pick([20,30,40])},
    {pool:"LAN_ESQUERDA com outro tamanho", start:[192,168,5,100], max:pick([5,20,50])}
  ]);
  const last = c.start.slice(); last[3] += c.max - 1;
  return { t:"txt",
    q:`No pool <b>${c.pool}</b>, o Start IP é <code>${ipStr(c.start)}</code> e o Max Users é <b>${c.max}</b>. Qual é o <b>último</b> IP que o DHCP pode entregar?`,
    fields:[{label:"último IP =", ans:ipStr(last)}],
    hint:"O primeiro IP já conta como um usuário. Último = início + (Max Users − 1).",
    exp:`<span class="f">${c.start[3]} + (${c.max} − 1) = ${last[3]}  →  ${ipStr(last)}</span>Por isso, no 5B, o PC1 recebe entre 192.168.5.100 e .109, e a LAN direita entre 172.19.200.200 e .249.` };
};

"rnn:0": `
<p>Um MLP comum é <b>estático</b>: a mesma entrada sempre gera a mesma saída, e ele não lembra de nada. Uma <b>rede recorrente</b> é um MLP com <b>realimentação</b>: parte do que a rede produziu volta como entrada no instante seguinte. Assim a saída de hoje depende do que aconteceu antes, e a rede responde ao sinal <b>ao longo do tempo</b> (por isso “dirigida dinamicamente”).</p>
<p>A realimentação cria um <b>estado</b>, um resumo do passado. Com ele, a rede não precisa receber uma janela enorme de entradas antigas, o que reduz a exigência de memória.</p>
<h3>As quatro arquiteturas</h3>
<ul>
<li><b>NARX</b> (modelo recorrente de entrada-saída): MLP que recebe as entradas externas u(n) e as <b>saídas passadas</b> y(n), y(n−1)…, guardadas numa <b>linha de atraso na saída</b>.</li>
<li><b>Espaço de estados</b>: descreve o sistema por um estado x(n). Útil quando se conhece a estrutura do sistema.<span class="f">x(n+1) = A·x(n) + B·u(n)
y(n)   = C·x(n)</span></li>
<li><b>Rede de Elman</b> (rede recorrente simples): realimenta o <b>estado interno</b>, ou seja, a saída da camada oculta. Não tem banco de atrasos na saída.<span class="f">x(n+1) = F(x(n), u(n))
y(n)   = G(x(n))        F e G não-lineares</span></li>
<li><b>RMLP</b> (perceptron multicamadas recorrente): cada camada computacional tem a <b>sua própria</b> realimentação.</li>
</ul>
<p class="key">Para não confundir: <b>NARX realimenta a saída</b>. <b>Elman realimenta o estado</b>.</p>`,

"rnn:1": `
<h3>A fórmula do NARX</h3>
<p>A próxima saída depende das q saídas anteriores e das q entradas anteriores:</p>
<span class="f">y(n+1) = F( y(n), …, y(n−q+1),  u(n), …, u(n−q+1) )</span>
<p>Exemplo com q = 2: para prever y(5), a rede recebe y(4), y(3), u(4) e u(3).</p>
<h3>Duas formas de alimentar o y passado</h3>
<ul>
<li><b>NARX para regressão</b> (aprendizado por imposição do professor): entram as <b>saídas reais medidas</b> do sistema. Não há realimentação de erro, então durante o treino a rede funciona como <b>não-recorrente</b>, um MLP comum com entradas atrasadas.</li>
<li><b>Modelo NOE</b> (Nonlinear Output Error): entram as <b>predições da própria rede</b>. Se ela errar, o erro volta para dentro dela. Esta é uma rede recorrente “pura”.</li>
</ul>
<p class="key">Imposição do professor = saída real. NOE = saída prevista.</p>
<h3>Espaço de estados linear e não-linear</h3>
<p>No linear, as matrizes A, B e C fazem tudo. No não-linear, uma função F(·) toma o lugar de A e B: x(n+1) = F(x(n), u(n)).</p>
<p>Exemplo escalar: com x(n+1) = 0,5·x(n) + 1·u(n), y = 2·x, x(0) = 0 e u(0) = 1, temos x(1) = 0,5·0 + 1·1 = 1 e y(1) = 2·1 = 2.</p>
<h3>Equivalência</h3>
<p>Se a rede recorrente é <b>observável</b> (dá para deduzir o estado olhando entradas e saídas), o modelo NARX consegue <b>simular</b> o modelo de espaço de estados.</p>`,

"rnn:2": `
<h3>Ponto de partida: redes estáticas</h3>
<p>Uma rede estática pode ser treinada em modo <b>por lote</b> (ajusta os pesos depois de ver todos os exemplos) ou <b>sequencial</b> (ajusta a cada exemplo).</p>
<h3>Redes recorrentes têm estado, então surgem dois modos</h3>
<ul>
<li><b>Treinamento por época</b>: a rede parte de um <b>estado inicial</b> e, a cada nova época, é <b>reinicializada</b> para ele. Combina com sequências de tamanho conhecido.</li>
<li><b>Treinamento contínuo</b>: <b>não há reinicialização</b>. A rede aprende enquanto processa o sinal. Combina com sinais que nunca param, como um sensor online.</li>
</ul>
<h3>Algoritmos</h3>
<ul>
<li><b>BPTT</b> (Backpropagation Through Time): o principal. Desdobra a rede no tempo e aplica o backpropagation (próxima fase).</li>
<li><b>ARTR</b>: usa uma <b>estimativa instantânea do gradiente</b>, atualizando a cada passo.</li>
</ul>
<p class="key">Época reinicia o estado. Contínuo nunca reinicia.</p>`,

"rnn:3": `
<h3>1. Desdobrar a rede no tempo</h3>
<p>A ideia do BPTT é transformar a rede recorrente numa rede em camadas: cada instante de tempo vira uma camada. Com o intervalo de n₀ = 0 a n₁ = 3, a rede vira 3 camadas empilhadas. Todas são <b>cópias da mesma rede</b>, então os pesos são <b>compartilhados</b>.</p>
<h3>2. Custo da época</h3>
<span class="f">E_total = ½ · Σ (n = n₀ … n₁) Σⱼ eⱼ²(n)</span>
<p>Soma o erro quadrático de todos os neurônios em todos os instantes do intervalo.</p>
<h3>3. Passo para frente</h3>
<p>Propaga o padrão temporal completo de n₀ até n₁, guardando entradas, estados e erros de cada instante.</p>
<h3>4. Passo para trás: gradientes locais de n₁ até n₀</h3>
<p>Começa pelo fim, porque o δ de um instante depende do δ do instante seguinte.</p>
<span class="f">Em n = n₁:
δⱼ(n) = φ'(vⱼ(n)) · eⱼ(n)

Para n₀ &lt; n &lt; n₁:

<p>Leia o colchete como <b>erro atual + erro que vem do futuro</b>. Esse termo do futuro é o que diferencia o BPTT do backpropagation padrão. Em n₁ não há futuro dentro do intervalo, então só entra o erro atual.</p>
<h3>5. Ajuste dos pesos</h3>
<span class="f">Δwⱼᵢ = η · Σ (n = n₀+1 … n₁) δⱼ(n) · xᵢ(n−1)</span>
<p>Como o peso é o mesmo em todas as camadas desdobradas, somam-se as contribuições de todos os instantes. Repare no <b>n−1</b>: o δ do instante n multiplica a entrada do instante anterior.</p>`,

<p>Elman mostrou que a rede com realimentação do estado consegue descobrir padrões no tempo.</p>

<p>A física só recebe o encapsulamento. O IP e o DLCI ficam na <b>subinterface ponto a ponto</b>.</p>
<h3>Router_4 e testes</h3>
<p>O Router_4 é uma ponta: basta a rota padrão <code>ip route 0.0.0.0 0.0.0.0 10.1.1.1</code>. Teste do trecho mais perto para o mais longe. Para o PVC use <code>show frame-relay pvc</code>; se aparecer INACTIVE ou DELETED, confira os DLCIs e a ligação na Cloud. Para saber qual ponta é DCE: <code>show controllers serial 0/3/1</code>.</p>`,

"net:3": `
<p>Em vez de digitar rotas à mão, os roteadores usam o <b>RIP</b> para anunciar as redes que conhecem e aprender as dos vizinhos.</p>
<h3>Configuração</h3>
<p>Dentro de <code>router rip</code>, uma linha <code>network</code> para cada rede <b>diretamente ligada</b> ao roteador, só o endereço, <b>sem máscara</b>.</p>
<span class="f">Router1: network 172.18.0.0 / 10.0.0.0 / 20.0.0.0
Router2: network 10.0.0.0 / 192.168.0.0
Router3: network 192.168.0.0 / 172.16.0.0 / 20.0.0.0</span>
<h3>Conferindo</h3>
<p>O RIP troca atualizações a cada 30 s, então espere um pouco e rode <code>show ip route</code>. Cada roteador deve ver as <b>5 redes</b>.</p>
<span class="f">C = diretamente conectada   R = aprendida pelo RIP   S = estática</span>
<p>Na Simulação, em Edit Filters &gt; IPv4, deixe só <b>RIP</b> e <b>ICMP</b>. <code>ping -n 30</code> envia 30 pacotes.</p>
<h3>Variante sem RIP</h3>
<p><code>no router rip</code> em cada roteador e depois rotas estáticas: 4 no Router1, 6 no Router2 e 4 no Router3. Cada rede remota fica com dois caminhos, e aparecem com a letra <b>S</b>.</p>`,

"net:4": `
<h3>Hosts utilizáveis</h3>
<span class="f">bits de host = 32 − prefixo
hosts úteis  = 2^(bits de host) − 2</span>
<p>Tira-se 2 porque o endereço de rede e o de broadcast não vão para hosts.</p>
<span class="f">/30  255.255.255.252   2 bits  →  2 hosts
/24  255.255.255.0     8 bits  →  254 hosts
/16  255.255.0.0      16 bits  →  65.534 hosts
/8   255.0.0.0        24 bits  →  16.777.214 hosts</span>
<h3>Endereço de rede e broadcast</h3>
<p>Onde a máscara é 255, copia o número do IP. Onde é 0, a rede leva 0 e o broadcast leva 255.</p>
<span class="f">172.19.200.215 / 255.255.0.0
rede      172.19.0.0
broadcast 172.19.255.255</span>
<p>No /30, os blocos andam de 4 em 4: 10.0.0.1 está no bloco 10.0.0.0 a 10.0.0.3, então a rede é 10.0.0.0 e o broadcast 10.0.0.3.</p>
<h3>Faixa do DHCP</h3>
<span class="f">último IP = Start IP + (Max Users − 1)
192.168.5.100 com 10 usuários → 192.168.5.109</span>`
};

/* ---------- estado ---------- */
let trackIdx = 0;
let S = null; // sessão de jogo

function build(q, ti, pi){
  const base = q.gen ? G[q.gen]() : q;
  const out = Object.assign({}, base, {ti, pi});
  if (out.t === "mc") { out.order = shuffle(out.o.map((_,i)=>i)); }
  if (out.t === "ord") { out.pool = shuffle(out.items.map((_,i)=>i)); }
  return out;
}
function startSessionNoLesson(mode, ti, pi){ startSession(mode, ti, pi, true); }
function startSession(mode, ti, pi, skipLesson){
  const tr = TRACKS[ti]; let queue = [], segments = [];
  if (mode === "phase"){ queue = shuffle(tr.phases[pi].qs).map(q=>build(q,ti,pi)); segments=[{pi,start:0,end:queue.length}]; }
  else if (mode === "journey"){
    tr.phases.forEach((ph,p)=>{ const s=queue.length; shuffle(ph.qs).forEach(q=>queue.push(build(q,ti,p))); segments.push({pi:p,start:s,end:queue.length}); });
  } else {
    const all=[]; tr.phases.forEach((ph,p)=>ph.qs.forEach(q=>all.push([q,p])));
    queue = shuffle(all).slice(0,10).map(([q,p])=>build(q,ti,p)); segments=[{pi:-1,start:0,end:queue.length}];
  }
  S = {mode, ti, pi, queue, segments, i:0, score:0, streak:0, best:0, results:[], hint:false, done:false};
  if (mode === "flash" || skipLesson) renderQ(); else renderLesson(ti, segments[0].pi, renderQ);
}

/* ---------- telas ---------- */
function signalPath(){
  let d=""; const W=600,H=70;
  for (let k=0;k<=400;k++){ const t=k/400*6.2; const y=Math.sin(t+Math.sin(t*t)); d+=(k?"L":"M")+(t/6.2*W).toFixed(1)+" "+(H/2-y*H*0.42).toFixed(1)+" "; }
  return d;
}
function renderLesson(ti, pi, next, standalone){
  const tr = TRACKS[ti], ph = tr.phases[pi];
  app.innerHTML = `
  ${standalone?"":`<div class="hud"><div class="left"><span>${S.i+1}/${S.queue.length}</span><span>pontos <b>${S.score}</b></span></div><button class="link" id="quit">Sair</button></div>
  <div class="bar"><i style="width:${(S.i/S.queue.length*100).toFixed(1)}%"></i></div>`}
  <section class="card">
    <div class="qhead"><span class="tag ${tr.id==="net"?"net":""}">${tr.label}=${pi+1} · ${ph.title}</span><span class="eyebrow">Aula</span></div>
    <h2>${ph.title}</h2>
    <div class="lesson">${LESSONS[tr.id+":"+pi]}</div>
    <div class="actions"><button class="btn" id="go">${standalone?"Jogar esta fase":"Entendi, começar as perguntas"}</button>${standalone?`<button class="link" id="quit">Voltar</button>`:""}</div>
  </section>`;
  $("#go").onclick = next;
  $("#quit").onclick = renderHome;
  window.scrollTo(0,0);
}
function renderHome(){
  S = null;
  const tr = TRACKS[trackIdx], best = store.get();
  app.innerHTML = `
  <header class="hero">
    <span class="eyebrow">Revisão para a prova</span>
    <h1>Revisão em Rede</h1>
    <p class="muted">Duas trilhas: redes neurais recorrentes e redes de computadores. Cada fase começa com uma aula curta, depois vêm as perguntas, e cada resposta traz a explicação.</p>
    <svg class="signal" viewBox="0 0 600 70" preserveAspectRatio="none" aria-hidden="true"><line class="base" x1="0" y1="35" x2="600" y2="35"/><path d="${signalPath()}"/></svg>
    <span class="mono muted" style="font-size:.8rem">x(n) = sen(n + sen(n²)), o sinal do exemplo de previsão da rede de Elman</span>
  </header>
  <div class="tabs" role="tablist">
    ${TRACKS.map((t,i)=>`<button class="tab" role="tab" id="tab-${t.id}" aria-selected="${i===trackIdx}" data-track="${i}">${t.tab}</button>`).join("")}
  </div>
  <section class="track-intro">
    <h2>${tr.tab}</h2>
    <p class="muted">${tr.intro}</p>
  </section>
  <ol class="chain">
    ${tr.phases.map((ph,i)=>{ const b = best[tr.id+":"+i];
      return `<li class="node ${b!=null?"done":""}">
        <div class="dot">${tr.label}=${i+1}</div>
        <div class="info"><b>${ph.title}</b><span>${ph.sub} · ${ph.qs.length} questões</span></div>
        <div class="node-side">
          <div class="links"><button class="read" data-read="${i}">Aula</button><button class="play" data-phase="${i}" aria-label="Jogar a fase ${ph.title}">Jogar</button></div>
          <span class="best">${b!=null?"recorde "+b+"%":"&nbsp;"}</span>
        </div>
      </li>`; }).join("")}
  </ol>
  <div class="cta-row">
    <button class="btn" id="btn-journey">Jornada completa</button>
    <button class="btn ghost" id="btn-flash">Relâmpago: 10 aleatórias</button>
  </div>
  ${best[tr.id+":journey"]!=null?`<p class="muted mono" style="font-size:.85rem">Recorde da jornada: ${best[tr.id+":journey"]} pontos</p>`:""}
  <details class="cola"><summary>Cola rápida desta trilha</summary><ul>${tr.cola.map(c=>`<li>${c}</li>`).join("")}</ul></details>`;
  app.querySelectorAll("[data-track]").forEach(b=>b.onclick=()=>{trackIdx=+b.dataset.track; renderHome();});
  app.querySelectorAll("[data-phase]").forEach(b=>b.onclick=()=>startSession("phase",trackIdx,+b.dataset.phase));
  app.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.read, t=trackIdx; renderLesson(t, i, ()=>{ S=null; startSessionNoLesson("phase",t,i); }, true); });
  $("#btn-journey").onclick=()=>startSession("journey",trackIdx);
  $("#btn-flash").onclick=()=>startSession("flash",trackIdx);
  window.scrollTo(0,0);
}

function points(q){ const base = (q.t==="num"||q.t==="txt"||q.t==="ord") ? 150 : 100; let p = Math.round(base*(1+0.1*Math.min(S.streak,5))); if (S.hint) p = Math.round(p/2); return p; }

function renderQ(){
  const q = S.queue[S.i], tr = TRACKS[S.ti], ph = tr.phases[q.pi];
  S.hint = false; S.answered = false;
  const seg = S.segments.find(s=>S.i>=s.start && S.i<s.end);
  const kind = {mc:"Múltipla escolha", vf:"Verdadeiro ou falso", num:"Cálculo", txt:"Cálculo", ord:"Ordenar"}[q.t];
  let body = "";
  if (q.t==="mc") body = `<div class="opts">${q.order.map((oi,k)=>`<button class="opt" data-o="${oi}"><span class="k">${k+1}</span><span>${q.o[oi]}</span></button>`).join("")}</div>`;
  if (q.t==="vf") body = `<div class="vf"><button class="opt" data-v="1">Verdadeiro</button><button class="opt" data-v="0">Falso</button></div>`;
  if (q.t==="num"||q.t==="txt") body = `<div class="fields">${q.fields.map((f,k)=>`<div class="field"><label for="f${k}">${f.label}</label><input id="f${k}" inputmode="${q.t==="num"?"decimal":"text"}" autocomplete="off" placeholder="${q.t==="num"?"ex.: −0,0425":"ex.: 192.168.5.0"}"></div>`).join("")}</div>
    <p class="muted" style="font-size:.85rem">${q.t==="num"?"Use vírgula ou ponto. Quatro casas decimais bastam; aceito erro de até 1%.":"Digite o endereço no formato a.b.c.d."}</p>`;
  if (q.t==="ord") body = `<div class="ord-pick" id="pick"></div><div class="ord-pool" id="pool">${q.pool.map(ii=>`<button class="opt" data-i="${ii}"><span class="k">+</span><span>${q.items[ii]}</span></button>`).join("")}</div>`;
  const canHint = q.t==="mc" || q.t==="num" || q.t==="txt";
  app.innerHTML = `
  <div class="hud">
    <div class="left"><span>${S.i+1}/${S.queue.length}</span><span>pontos <b>${S.score}</b></span>${S.streak>=2?`<span class="combo">combo ×${S.streak}</span>`:""}</div>
    <button class="link" id="quit">Sair</button>
  </div>
  <div class="bar"><i style="width:${(S.i/S.queue.length*100).toFixed(1)}%"></i></div>
  <section class="card">
    <div class="qhead"><span class="tag ${tr.id==="net"?"net":""}">${tr.label}=${q.pi+1} · ${ph.title}</span><span class="eyebrow">${kind}</span></div>
    <div class="qtext">${q.q}</div>
    ${body}
    <div class="actions" id="actions">
      ${(q.t==="num"||q.t==="txt")?`<button class="btn" id="check">Verificar</button>`:""}
      ${q.t==="ord"?`<button class="btn" id="check" disabled>Conferir ordem</button><button class="link" id="clear">Recomeçar</button>`:""}
      ${canHint?`<button class="link" id="hint">${q.t==="mc"?"Dica: eliminar 2 alternativas (metade dos pontos)":"Ver dica (metade dos pontos)"}</button>`:""}
    </div>
    <div id="hintbox"></div>
    <div id="fb"></div>
  </section>`;
  $("#quit").onclick = renderHome;
  if (q.t==="mc") app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(+b.dataset.o===0, b));
  if (q.t==="vf") app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>answer((b.dataset.v==="1")===q.a, b));
  if (q.t==="num"||q.t==="txt"){
    $("#check").onclick = checkFields;
    app.querySelectorAll(".field input").forEach(inp=>inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!S.answered) checkFields(); }));
    setTimeout(()=>{ const f=$("#f0"); if (f && window.matchMedia("(pointer:fine)").matches) f.focus(); },0);
  }
  if (q.t==="ord"){
    S.picked = [];
    app.querySelectorAll("#pool [data-i]").forEach(b=>b.onclick=()=>{ if(S.answered) return; S.picked.push(+b.dataset.i); b.hidden=true; drawPick(); });
    $("#clear").onclick=()=>{ if(S.answered) return; S.picked=[]; app.querySelectorAll("#pool [data-i]").forEach(b=>b.hidden=false); drawPick(); };
    $("#check").onclick=()=>{ const ok = S.picked.every((v,k)=>v===k); answer(ok, null); };
  }
  const hb = $("#hint");
  if (hb) hb.onclick = ()=>{
    if (S.answered || S.hint) return; S.hint = true; hb.remove();
    if (q.t==="mc"){ const wrong = shuffle(q.order.filter(o=>o!==0)).slice(0,2); wrong.forEach(o=>{ const b=app.querySelector(`[data-o="${o}"]`); b.disabled=true; b.classList.add("gone"); }); }
    else $("#hintbox").innerHTML = `<p class="exp"><b>Dica:</b> ${q.hint}</p>`;
  };
  window.scrollTo(0,0);
}
function drawPick(){
  const q = S.queue[S.i];
  $("#pick").innerHTML = S.picked.map((ii,k)=>`<div class="opt" style="cursor:default"><span class="k">${k+1}</span><span>${q.items[ii]}</span></div>`).join("");
  $("#check").disabled = S.picked.length !== q.items.length;
}
function normIP(s){ return String(s).trim().replace(/\s/g,"").replace(/,/g,"."); }
function checkFields(){
  const q = S.queue[S.i]; let ok = true, empty = false;
  q.fields.forEach((f,k)=>{
    const inp = $("#f"+k), v = inp.value; if (v.trim()==="") empty = true;
    let good;
    if (q.t==="txt") good = normIP(v) === f.ans;
    else { const u = parseNum(v); good = !isNaN(u) && (f.exact ? u===f.ans : near(u,f.ans)); }
    inp.classList.toggle("right", good); inp.classList.toggle("wrong", !good); inp.disabled = true;
    if (!good) ok = false;
  });
  if (empty && !ok){ q.fields.forEach((f,k)=>{ const i=$("#f"+k); i.disabled=false; i.classList.remove("right","wrong"); }); $("#hintbox").innerHTML = `<p class="exp muted">Preencha todos os campos antes de verificar.</p>`; return; }
  answer(ok, null);
}
function answer(ok, btn){
  if (S.answered) return; S.answered = true;
  const q = S.queue[S.i];
  let gained = 0;
  if (ok){ S.streak++; gained = points(q); S.score += gained; S.best = Math.max(S.best,S.streak); }
  else S.streak = 0;
  S.results.push({q, ok});
  let correctTxt = "";
  if (q.t==="mc"){
    app.querySelectorAll("[data-o]").forEach(b=>{ b.disabled=true; if(+b.dataset.o===0) b.classList.add("right"); });
    if (!ok && btn) btn.classList.add("wrong");
  }
  if (q.t==="vf"){
    app.querySelectorAll("[data-v]").forEach(b=>{ b.disabled=true; if((b.dataset.v==="1")===q.a) b.classList.add("right"); });
    if (!ok && btn) btn.classList.add("wrong");
  }
  if (q.t==="num"||q.t==="txt") correctTxt = `<p class="mono" style="font-size:.9rem">Resposta: ${q.fields.map(f=>f.label+" "+(q.t==="txt"?f.ans:fmt(f.ans))).join("  ·  ")}</p>`;
  if (q.t==="ord"){ $("#check").disabled = true; if(!ok) correctTxt = `<ol style="margin:0;padding-left:20px">${q.items.map(t=>`<li>${t}</li>`).join("")}</ol>`; }
  const hint = $("#hint"); if (hint) hint.remove();
  const clr = $("#clear"); if (clr) clr.remove();
  const chk = $("#check"); if (chk && q.t!=="ord") chk.remove();
  const last = S.i === S.queue.length-1;
  const seg = S.segments.find(s=>S.i>=s.start && S.i<s.end);
  const segEnd = S.mode==="journey" && S.i === seg.end-1 && !last;
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"no"}" role="status">
    <h3>${ok?`Certo! +${gained}`:"Não foi dessa vez"}</h3>
    ${correctTxt}
    <div class="exp">${q.exp}</div>
  </div>
  <div class="actions" style="margin-top:12px"><button class="btn" id="next">${last?"Ver resultado":segEnd?"Fechar fase":"Próxima"}</button></div>`;
  const nx = $("#next"); nx.onclick = ()=>{ if (last) renderEnd(); else if (segEnd) renderSegment(seg); else { S.i++; renderQ(); } };
  nx.focus({preventScroll:true});
  $("#fb").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"nearest"});
}
function segStats(seg){ const r = S.results.slice(seg.start, seg.end); const c = r.filter(x=>x.ok).length; return {c, n:r.length, pct:Math.round(c/Math.max(1,r.length)*100)}; }
function saveBest(key, val){ const b = store.get(); if (b[key]==null || val > b[key]) { b[key]=val; store.set(b); return true; } return false; }
function renderSegment(seg){
  const tr = TRACKS[S.ti], st = segStats(seg), ph = tr.phases[seg.pi];
  saveBest(tr.id+":"+seg.pi, st.pct);
  const nextPh = tr.phases[seg.pi+1];
  app.innerHTML = `
  <section class="card">
    <span class="eyebrow">${tr.label}=${seg.pi+1} concluído</span>
    <h2>${ph.title}</h2>
    <div class="stats">
      <div class="stat"><b>${st.c}/${st.n}</b><span>acertos</span></div>
      <div class="stat"><b>${st.pct}%</b><span>da fase</span></div>
      <div class="stat"><b>${S.score}</b><span>pontos até aqui</span></div>
    </div>
    <p class="muted">Próximo: <b>${tr.label}=${seg.pi+2} · ${nextPh.title}</b>, ${nextPh.sub.toLowerCase()}.</p>
    <div class="actions"><button class="btn" id="go">Ler a aula de ${tr.label}=${seg.pi+2}</button><button class="link" id="quit">Parar aqui</button></div>
  </section>`;
  $("#go").onclick = ()=>{ S.i++; renderLesson(S.ti, seg.pi+1, renderQ); };
  $("#quit").onclick = renderHome;
  $("#go").focus({preventScroll:true});
  window.scrollTo(0,0);
}
function renderEnd(){
  const tr = TRACKS[S.ti], total = S.results.length, c = S.results.filter(r=>r.ok).length, pct = Math.round(c/total*100);
  let rec = false;
  if (S.mode==="phase") rec = saveBest(tr.id+":"+S.pi, pct);
  if (S.mode==="journey"){ S.segments.forEach(seg=>saveBest(tr.id+":"+seg.pi, segStats(seg).pct)); rec = saveBest(tr.id+":journey", S.score); }
  const msg = pct>=90 ? "Pronta para a prova nesse conteúdo." : pct>=70 ? "Bom resultado. Revise as que errou logo abaixo." : pct>=50 ? "Metade do caminho. Vale ler as explicações e jogar de novo." : "Comece pela cola rápida e tente de novo: as contas mudam a cada partida.";
  const wrong = S.results.filter(r=>!r.ok);
  const strip = h => h.replace(/<span class="f">[\s\S]*?<\/span>/g," [conta] ").replace(/<[^>]+>/g,"");
  app.innerHTML = `
  <section class="card">
    <span class="eyebrow">${S.mode==="journey"?"Jornada completa":S.mode==="flash"?"Relâmpago":tr.label+"="+(S.pi+1)+" · "+tr.phases[S.pi].title} · ${tr.tab}</span>
    <div class="big">${S.score}<span class="muted" style="font-size:1rem;font-weight:500"> pontos${rec?" · novo recorde":""}</span></div>
    <div class="stats">
      <div class="stat"><b>${c}/${total}</b><span>acertos</span></div>
      <div class="stat"><b>${pct}%</b><span>aproveitamento</span></div>
      <div class="stat"><b>×${S.best}</b><span>maior combo</span></div>
    </div>
    <p>${msg}</p>
    <div class="actions"><button class="btn" id="again">Jogar de novo</button><button class="btn ghost" id="home">Escolher outra fase</button></div>
  </section>
  ${wrong.length?`<section class="card"><h2>Para revisar (${wrong.length})</h2><div class="review">${wrong.map(r=>`<article><span class="q">${strip(r.q.q)}</span>${r.q.t==="mc"?`<span><b>Certa:</b> ${r.q.o[0]}</span>`:r.q.t==="vf"?`<span><b>Certa:</b> ${r.q.a?"Verdadeiro":"Falso"}</span>`:(r.q.t==="num"||r.q.t==="txt")?`<span class="mono"><b>Certa:</b> ${r.q.fields.map(f=>f.label+" "+(r.q.t==="txt"?f.ans:fmt(f.ans))).join(" · ")}</span>`:`<span><b>Ordem:</b> ${r.q.items.join(" → ")}</span>`}<span class="muted">${strip(r.q.exp)}</span></article>`).join("")}</div></section>`:""}`;
  const m = S.mode, ti = S.ti, pi = S.pi;
  $("#again").onclick = ()=>startSession(m, ti, pi);
  $("#home").onclick = renderHome;
  window.scrollTo(0,0);
}

/* teclado: 1–4 escolhe, V/F, Enter avança */
document.addEventListener("keydown", e=>{
  if (!S || e.target.tagName==="INPUT") return;
  const q = S.queue && S.queue[S.i]; if (!q) return;
  if (!S.answered && q.t==="mc" && /^[1-4]$/.test(e.key)){ const b = app.querySelectorAll("[data-o]")[+e.key-1]; if (b && !b.disabled) b.click(); }
  if (!S.answered && q.t==="vf" && /^[vf]$/i.test(e.key)){ app.querySelector(`[data-v="${e.key.toLowerCase()==="v"?1:0}"]`).click(); }
});

renderHome();
window.__RNN_TEST__ = {G, TRACKS};
})();
</script>
